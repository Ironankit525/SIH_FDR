# Optional deployment-like stack. The default README workflow does NOT run Docker.
name: depositflow
x-backend: &backend
  build: ./backend
  environment: &backend-env
    ENVIRONMENT: ${ENVIRONMENT:-development}
    DATABASE_URL: postgresql+psycopg://depositflow:${POSTGRES_PASSWORD:?Run python3 scripts/configure.py}@postgres:5432/depositflow
    STORAGE_BACKEND: s3
    STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY:?Run python3 scripts/configure.py}
    SECRET_KEY: ${SECRET_KEY:?Run python3 scripts/configure.py}
    S3_ENDPOINT: http://minio:9000
    S3_BUCKET: depositflow-private
    S3_ACCESS_KEY: ${MINIO_ROOT_USER:-depositflow-local}
    S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Run python3 scripts/configure.py}
    JOB_MODE: celery
    REDIS_URL: redis://redis:6379/0
    FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    REQUIRE_MALWARE_SCAN: ${REQUIRE_MALWARE_SCAN:-false}
    CLAMAV_HOST: ${CLAMAV_HOST:-}
    DEMO_PASSWORD: ${DEMO_PASSWORD:-DemoFlow2026!}
  restart: unless-stopped
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: depositflow
      POSTGRES_USER: depositflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/configure.py}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U depositflow -d depositflow']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory, 128mb, --maxmemory-policy, noeviction]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-depositflow-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run python3 scripts/configure.py}
    volumes: [minio-data:/data]
    ports: ['127.0.0.1:9001:9001']
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-depositflow-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run python3 scripts/configure.py}
    entrypoint: [/bin/sh, -c]
    command:
      - 'until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done; mc mb --ignore-existing local/depositflow-private && mc anonymous set none local/depositflow-private'
  migrate:
    <<: *backend
    command: [alembic, upgrade, head]
    restart: 'no'
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
  api:
    <<: *backend
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    <<: *backend
    command: [celery, -A, app.worker.celery, worker, --loglevel=warning, --concurrency=1]
    depends_on:
      api: {condition: service_healthy}
  scheduler:
    <<: *backend
    command: [celery, -A, app.worker.celery, beat, --loglevel=warning, --schedule=/app/.data/celerybeat-schedule]
    depends_on:
      api: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ['127.0.0.1:5173:80']
    depends_on:
      api: {condition: service_healthy}
  clamav:
    image: clamav/clamav:stable
    profiles: [malware-scan]
    volumes: [clamav-data:/var/lib/clamav]
volumes:
  postgres-data:
  redis-data:
  minio-data:
  clamav-data:
